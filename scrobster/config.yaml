---
name: scrobSter
version: "0.2.3"
slug: scrobster
description: >-
  Identify the music playing around you with Shazam and scrobble it to Last.fm,
  Libre.fm, ListenBrainz or Maloja.
url: https://github.com/benkelly/ha-addons/tree/main/scrobster
arch:
  - aarch64
  - amd64
# Pre-built multi-arch image, so nothing is compiled on the device.
image: ghcr.io/benkelly/scrobster
startup: services
# Take the microphone from the Home Assistant audio system. Choose the input
# under the add-on Audio setting; the add-on follows that choice.
audio: true
ingress: true
ingress_port: 8000
panel_icon: mdi:music-circle
ports:
  8000/tcp: null
ports_description:
  8000/tcp: Web interface, only needed for access without ingress
options:
  audio_backend: pulse
  audio_device: default
  match_interval: 15
  chunk_seconds: 12
  rescrobble_minutes: 30
  now_playing_stop_seconds: 180
  admin_username: admin
schema:
  audio_backend: list(pulse|alsa)
  audio_device: str
  # The first start creates this account. Everything else is managed in the web
  # page, under Settings and Users.
  admin_username: str
  admin_password: password?
  # Above 14 seconds Shazam stops matching, so the window is capped.
  chunk_seconds: int(5,14)
  match_interval: int(12,600)
  rescrobble_minutes: int(1,1440)
  now_playing_stop_seconds: int(30,3600)
  listenbrainz_token: password?
  listenbrainz_url: str?
  lastfm_api_key: str?
  lastfm_api_secret: password?
  lastfm_session_key: password?
  lastfm_username: str?
  librefm_username: str?
  librefm_password: password?
  librefm_password_hash: password?
  maloja_url: str?
  maloja_key: password?
  api_token: password?
