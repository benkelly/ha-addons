---
name: AIOStreams
version: "2.34.0"
slug: aiostreams
description: >-
  Consolidate multiple Stremio addons and debrid services into a single,
  customisable super-addon.
url: https://github.com/benkelly/ha-addons/tree/main/aiostreams
arch:
  - aarch64
  - amd64
init: false
# Needed so a generated SECRET_KEY can be written back to the add-on options.
hassio_api: true
startup: services
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: AIOStreams web interface
webui: "http://[HOST]:[PORT:3000]"
options:
  SECRET_KEY: ""
  BASE_URL: ""
  LOG_LEVEL: info
  LOG_FORMAT: text
  SYSTEM_LIFECYCLE_ENABLED: false
schema:
  SECRET_KEY: password
  BASE_URL: str?
  ADDON_NAME: str?
  DATABASE_URI: str?
  AIOSTREAMS_AUTH: password?
  AIOSTREAMS_AUTH_PERMISSIONS: str?
  REDIS_URI: str?
  LOG_LEVEL: list(error|warn|info|http|verbose|debug|silly)?
  LOG_FORMAT: list(text|json)?
  SYSTEM_LIFECYCLE_ENABLED: bool?
