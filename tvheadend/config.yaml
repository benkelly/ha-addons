---
name: Tvheadend
version: "4.3.2763"
slug: tvheadend
description: >-
  TV streaming server and recorder for DVB, ATSC, IPTV and SAT>IP sources.
url: https://github.com/benkelly/ha-addons/tree/main/tvheadend
arch:
  - aarch64
  - amd64
  - armv7
startup: services
ports:
  9981/tcp: 9981
  9982/tcp: 9982
ports_description:
  9981/tcp: Web interface and HTTP streaming
  9982/tcp: HTSP, used by Kodi and other Tvheadend clients
webui: "http://[HOST]:[PORT:9981]"
map:
  - media:rw
# Tuner cards appear under /dev/dvb. udev lets Tvheadend see adapters that are
# plugged in after the add-on has started.
devices:
  - /dev/dvb
udev: true
options:
  first_run_no_auth: false
  debug: false
schema:
  adapters: str?
  first_run_no_auth: bool
  debug: bool
