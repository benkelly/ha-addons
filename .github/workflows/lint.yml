---
name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon-lint:
    name: Add-on linter (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - aiostreams
          - dispatcharr
          - remux
          - scrobster
          - tvheadend
          - uhf-server
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"
