---
name: Update add-ons

# Checks daily for new upstream releases and, for each add-on with one, opens a
# pull request bumping the pinned image tag, the add-on version and the
# changelog. Nothing is merged automatically: every bump is reviewed by hand.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: aiostreams
            name: AIOStreams
            upstream: Viren070/AIOStreams
            image: ghcr.io/viren070/aiostreams
            # Image tags match the git tags, v prefix included.
            image_tag_style: same
          - addon: uhf-server
            name: UHF Server
            upstream: swapplications/uhf-server-dist
            image: docker.io/swapplications/uhf-server
            image_tag_style: same
          - addon: dispatcharr
            name: Dispatcharr
            upstream: Dispatcharr/Dispatcharr
            image: ghcr.io/dispatcharr/dispatcharr
            # Upstream tags v0.29.0 but publishes the image as 0.29.0.
            image_tag_style: strip-v
          - addon: remux
            name: Remux
            upstream: lostb1t/remux
            image: ghcr.io/lostb1t/remux
            # Upstream tags v0.26.0 but publishes the image as 0.26.0.
            image_tag_style: strip-v
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve the latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ matrix.upstream }}
          IMAGE: ${{ matrix.image }}
          ADDON: ${{ matrix.addon }}
          IMAGE_TAG_STYLE: ${{ matrix.image_tag_style }}
        run: |
          set -euo pipefail

          # Prefer the latest published release. Not every upstream publishes
          # releases, so fall back to the highest semver tag.
          if gh api "repos/${UPSTREAM}/releases/latest" \
              > "${RUNNER_TEMP}/release.json" 2>/dev/null; then
            latest="$(jq -r '.tag_name' "${RUNNER_TEMP}/release.json")"
            jq -r '.body // ""' "${RUNNER_TEMP}/release.json" \
              > "${RUNNER_TEMP}/notes.md"
          else
            echo "No published release for ${UPSTREAM}, falling back to tags."
            gh api "repos/${UPSTREAM}/tags" --paginate --jq '.[].name' \
              > "${RUNNER_TEMP}/tags.txt"
            # Repositories can carry tags that are not version tags, so keep
            # only strict semver before sorting.
            latest="$(grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              "${RUNNER_TEMP}/tags.txt" \
              | sed 's/^v//' | sort -V | tail -n1 || true)"
            # Restore the v prefix if upstream uses one.
            if grep -qx "v${latest}" "${RUNNER_TEMP}/tags.txt"; then
              latest="v${latest}"
            fi
            : > "${RUNNER_TEMP}/notes.md"
          fi

          current="$(sed -n \
            "s#^FROM ${IMAGE}:\(.*\)\$#\1#p" \
            "${ADDON}/Dockerfile")"

          if [ -z "${latest}" ] || [ "${latest}" = "null" ]; then
            echo "Could not resolve the latest upstream tag." >&2
            exit 1
          fi
          if [ -z "${current}" ]; then
            echo "Could not find the pinned tag in ${ADDON}/Dockerfile." >&2
            exit 1
          fi

          version="${latest#v}"

          # The registry tag is not always the git tag: some upstreams publish
          # the version without the v prefix they tag with.
          if [ "${IMAGE_TAG_STYLE}" = "strip-v" ]; then
            image_tag="${version}"
          else
            image_tag="${latest}"
          fi

          echo "Pinned image tag: ${current}"
          echo "Latest release:   ${latest}"
          echo "Wanted image tag: ${image_tag}"

          # current comes out of the Dockerfile, so it is an image tag and has
          # to be compared against one.
          changed=false
          if [ "${image_tag}" != "${current}" ]; then
            # The upstream repo can be tagged before the image is pushed. Only
            # propose the bump once the image actually exists.
            if docker manifest inspect "${IMAGE}:${image_tag}" > /dev/null 2>&1; then
              changed=true
            else
              echo "::notice::${IMAGE}:${image_tag} is not published yet, skipping."
            fi
          fi

          {
            echo "latest=${latest}"
            echo "current=${current}"
            echo "version=${version}"
            echo "image_tag=${image_tag}"
            echo "changed=${changed}"
          } >> "${GITHUB_OUTPUT}"

      - name: Apply the update
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM: ${{ matrix.upstream }}
          IMAGE: ${{ matrix.image }}
          ADDON: ${{ matrix.addon }}
          NAME: ${{ matrix.name }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          CURRENT: ${{ steps.upstream.outputs.current }}
          VERSION: ${{ steps.upstream.outputs.version }}
          IMAGE_TAG: ${{ steps.upstream.outputs.image_tag }}
        run: |
          set -euo pipefail

          # Pin the new image tag, never latest.
          sed -i "s#^FROM ${IMAGE}:.*#FROM ${IMAGE}:${IMAGE_TAG}#" \
            "${ADDON}/Dockerfile"

          # Keep the add-on version in the same format as the original: the
          # upstream tag with any leading v stripped.
          sed -i "s#^version: .*#version: \"${VERSION}\"#" \
            "${ADDON}/config.yaml"

          release_url="https://github.com/${UPSTREAM}/releases/tag/${LATEST}"

          # Prepend a changelog entry, newest first.
          {
            printf '# Changelog\n\n'
            printf '## %s\n\n' "${VERSION}"
            printf -- '- Update %s to [%s](%s).\n\n' \
              "${NAME}" "${LATEST}" "${release_url}"
            tail -n +2 "${ADDON}/CHANGELOG.md" | sed '/./,$!d'
          } > "${RUNNER_TEMP}/CHANGELOG.md"
          mv "${RUNNER_TEMP}/CHANGELOG.md" "${ADDON}/CHANGELOG.md"

          # Build the pull request body, including the upstream release notes.
          {
            printf 'Updates %s from `%s` to `%s`.\n\n' \
              "${NAME}" "${CURRENT}" "${IMAGE_TAG}"
            printf 'Upstream release: %s\n\n' "${release_url}"
            printf '## Upstream release notes\n\n'
            if [ -s "${RUNNER_TEMP}/notes.md" ]; then
              cat "${RUNNER_TEMP}/notes.md"
            else
              printf '_No release notes published upstream._\n'
            fi
          } > "${RUNNER_TEMP}/pr-body.md"

          git --no-pager diff --stat

      - name: Open a pull request
        if: steps.upstream.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/${{ matrix.addon }}-${{ steps.upstream.outputs.latest }}
          delete-branch: true
          add-paths: |
            ${{ matrix.addon }}/Dockerfile
            ${{ matrix.addon }}/config.yaml
            ${{ matrix.addon }}/CHANGELOG.md
          commit-message: >-
            Update ${{ matrix.name }} to ${{ steps.upstream.outputs.latest }}
          title: >-
            Update ${{ matrix.name }} to ${{ steps.upstream.outputs.latest }}
          body-path: ${{ runner.temp }}/pr-body.md
          labels: upstream-update

  # Add-ons pinned by digest rather than by tag, because their upstream
  # publishes only rolling tags and has no releases to follow.
  update-digest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: tvheadend
            name: Tvheadend
            upstream: tvheadend/tvheadend
            image: ghcr.io/tvheadend/tvheadend
            tag: master-debian
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve the current image digest
        id: upstream
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          ADDON: ${{ matrix.addon }}
        run: |
          set -euo pipefail

          # The index digest, so the pin stays multi-arch.
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"

          current="$(sed -n \
            "s#^FROM ${IMAGE}@\(sha256:[0-9a-f]\{64\}\)\$#\1#p" \
            "${ADDON}/Dockerfile")"

          if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
            echo "Could not resolve the digest of ${IMAGE}:${TAG}." >&2
            exit 1
          fi
          if [ -z "${current}" ]; then
            echo "Could not find the pinned digest in ${ADDON}/Dockerfile." >&2
            exit 1
          fi

          echo "Pinned:  ${current}"
          echo "Current: ${digest}"

          changed=false
          if [ "${digest}" != "${current}" ]; then
            changed=true
          fi

          # Git branch names cannot contain a colon, so the branch uses a
          # short form of the digest rather than the full sha256: reference.
          {
            echo "digest=${digest}"
            echo "current=${current}"
            echo "short_digest=$(echo "${digest#sha256:}" | cut -c1-12)"
            echo "changed=${changed}"
          } >> "${GITHUB_OUTPUT}"

      - name: Apply the update
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM: ${{ matrix.upstream }}
          IMAGE: ${{ matrix.image }}
          ADDON: ${{ matrix.addon }}
          NAME: ${{ matrix.name }}
          TAG: ${{ matrix.tag }}
          DIGEST: ${{ steps.upstream.outputs.digest }}
          CURRENT: ${{ steps.upstream.outputs.current }}
        run: |
          set -euo pipefail

          # Each digest pinned add-on ships a script that reports the version
          # of a given image, since there is no release number to read.
          version="$(IMAGE_REF="${IMAGE}@${DIGEST}" "./${ADDON}/upstream-version.sh")"
          revision="$(docker inspect "${IMAGE}@${DIGEST}" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          short="$(echo "${revision}" | cut -c1-12)"

          echo "Version:  ${version}"
          echo "Revision: ${short}"

          sed -i "s#^FROM ${IMAGE}@sha256:[0-9a-f]*\$#FROM ${IMAGE}@${DIGEST}#" \
            "${ADDON}/Dockerfile"
          sed -i "s#^version: .*#version: \"${version}\"#" \
            "${ADDON}/config.yaml"

          commit_url="https://github.com/${UPSTREAM}/commit/${revision}"

          # Prepend a changelog entry, newest first.
          {
            printf '# Changelog\n\n'
            printf '## %s\n\n' "${version}"
            printf -- '- Update %s to upstream commit [%s](%s).\n\n' \
              "${NAME}" "${short}" "${commit_url}"
            tail -n +2 "${ADDON}/CHANGELOG.md" | sed '/./,$!d'
          } > "${RUNNER_TEMP}/CHANGELOG.md"
          mv "${RUNNER_TEMP}/CHANGELOG.md" "${ADDON}/CHANGELOG.md"

          {
            printf 'Updates %s to the current `%s` image.\n\n' "${NAME}" "${TAG}"
            printf '| | |\n| --- | --- |\n'
            printf '| Version | `%s` |\n' "${version}"
            printf '| Upstream commit | [`%s`](%s) |\n' "${short}" "${commit_url}"
            printf '| Digest | `%s` |\n' "${DIGEST}"
            printf '| Previous digest | `%s` |\n\n' "${CURRENT}"
            printf '%s publishes no release tags, so the image is pinned by ' "${NAME}"
            printf 'digest and the version comes from the binary itself.\n\n'
            printf 'There are no upstream release notes to quote. Compare the '
            printf 'commits before merging.\n'
          } > "${RUNNER_TEMP}/pr-body.md"

          git --no-pager diff --stat

      - name: Open a pull request
        if: steps.upstream.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/${{ matrix.addon }}-${{ steps.upstream.outputs.short_digest }}
          delete-branch: true
          add-paths: |
            ${{ matrix.addon }}/Dockerfile
            ${{ matrix.addon }}/config.yaml
            ${{ matrix.addon }}/CHANGELOG.md
          commit-message: >-
            Update ${{ matrix.name }} to the current ${{ matrix.tag }} image
          title: >-
            Update ${{ matrix.name }} to the current ${{ matrix.tag }} image
          body-path: ${{ runner.temp }}/pr-body.md
          labels: upstream-update
