---
name: UHF Server
version: "2.0.0"
slug: uhf_server
description: >-
  DVR recording server for the UHF app, with recordings stored in the Home
  Assistant media folder.
url: https://github.com/benkelly/ha-addons/tree/main/uhf-server
arch:
  - aarch64
  - amd64
init: true
startup: services
boot: auto
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: UHF Server API, used by the UHF app
watchdog: "http://[HOST]:[PORT:8000]/server/stats"
map:
  - media:rw
options:
  port: 8000
  recordings_dir: /media/uhf-recordings
  enable_commercial_detection: false
schema:
  port: int(1,65535)
  password: password?
  recordings_dir: str
  enable_commercial_detection: bool
