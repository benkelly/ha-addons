---
name: Dispatcharr
version: "0.30.0"
slug: dispatcharr
description: >-
  IPTV playlist and EPG management, consolidating multiple providers into one
  tidy source.
url: https://github.com/benkelly/ha-addons/tree/main/dispatcharr
arch:
  - aarch64
  - amd64
# The upstream image carries its own s6-overlay init.
init: false
startup: services
ports:
  9191/tcp: 9191
ports_description:
  9191/tcp: Web interface, plus M3U, XMLTV, Xtream Codes and HDHomeRun output
webui: "http://[HOST]:[PORT:9191]"
map:
  - media:rw
options:
  log_level: info
  puid: 1000
  pgid: 1000
schema:
  log_level: list(trace|debug|info|warning|error|critical)?
  puid: int(1,65535)
  pgid: int(1,65535)
  trusted_proxies: str?
  setup_allowed_ip: str?
